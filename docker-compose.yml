services:

  llm:
    image: llama-cuda13:local
    container_name: qwen3
    restart: unless-stopped

    ports:
      - "8080:8080"

    volumes:
      - /mnt/d/AI/models:/models:ro

    command:
      - -m
      - /models/Qwen_Qwen3-4B-Q4_K_M.gguf
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - -ngl
      - "99"
      - -c
      - "8192"
      - -np
      - "1"
      - --reasoning
      - "off"
      - -lv
      - "3"

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]


  embedding:
    image: llama-cuda13:local
    container_name: bge-m3
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      - /mnt/d/AI/models:/models:ro
    command:
      - -m
      - /models/bge-m3-F16.gguf
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --embedding
      - --pooling
      - "cls"
      - -ngl
      - "99"
      - -c
      - "8192"
      - -b
      - "2048"
      - -ub
      - "2048"
      - -np
      - "4"
      - -lv
      - "3"
      - -fa
      - "on"

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]